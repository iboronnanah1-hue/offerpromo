<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ultaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="ultaGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="cardShadowUlta" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#431407" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="#fdf4f0" />
  
  <!-- Subtle pattern dots -->
  <g opacity="0.08" fill="#ea580c">
    <circle cx="40" cy="40" r="3" />
    <circle cx="80" cy="40" r="3" />
    <circle cx="120" cy="40" r="3" />
    <circle cx="480" cy="40" r="3" />
    <circle cx="520" cy="40" r="3" />
    <circle cx="560" cy="40" r="3" />
    <circle cx="40" cy="320" r="3" />
    <circle cx="80" cy="320" r="3" />
    <circle cx="520" cy="320" r="3" />
    <circle cx="560" cy="320" r="3" />
  </g>

  <!-- Card Container -->
  <g transform="translate(60, 40)" filter="url(#cardShadowUlta)">
    <rect width="480" height="280" rx="20" fill="url(#ultaBg)" />
    <rect width="480" height="280" rx="20" fill="url(#ultaGleam)" />
    <rect width="480" height="280" rx="20" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" />

    <!-- Ulta Beauty Logo Text -->
    <g transform="translate(50, 52)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="2">ULTA</text>
      <text x="95" y="-2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#fed7aa" letter-spacing="3">BEAUTY</text>
    </g>

    <!-- Gift Card Pill Tag -->
    <g transform="translate(330, 40)">
      <rect width="105" height="30" rx="15" fill="#ffffff" fill-opacity="0.22" />
      <text x="52" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">GIFT CARD</text>
    </g>

    <!-- EMV Chip Accent -->
    <g transform="translate(50, 115)">
      <rect width="44" height="34" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5" />
      <line x1="0" y1="17" x2="44" y2="17" stroke="#b45309" stroke-width="1" />
      <line x1="22" y1="0" x2="22" y2="34" stroke="#b45309" stroke-width="1" />
      <rect x="14" y="9" width="16" height="16" rx="3" fill="none" stroke="#b45309" stroke-width="1" />
    </g>

    <!-- Value Badge -->
    <g transform="translate(50, 205)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">$500</text>
      <text x="125" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffedd5">BEAUTY PROMOTION</text>
      <text x="125" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#fed7aa">Valid on Cosmetics, Skincare &amp; Fragrance</text>
    </g>

    <!-- Decorative Card Number Dots -->
    <g transform="translate(50, 248)" fill="#ffffff" fill-opacity="0.4" font-family="monospace" font-size="13" letter-spacing="3">
      <text y="0">••••  ••••  ••••  7443</text>
    </g>
  </g>
</svg>
